services:
  postgres:
    image: postgres:14-alpine
    container_name: sorascm-postgres
    restart: always
    environment:
      POSTGRES_DB: sorascm_db
      POSTGRES_USER: sorascm_app
      POSTGRES_PASSWORD: sorascm_secure_dev_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sorascm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sorascm-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sorascm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"

volumes:
  pgdata: